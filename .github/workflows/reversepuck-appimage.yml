name: ReversePuck AppImage

# Builds ReversePuck-<version>-x86_64.AppImage (the Steam Deck app, see ReversePuck/packaging/) on every
# commit that touches the app, for every PR, and on release tags, where it is also attached to the release.
on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
    paths:
      - 'ReversePuck/**'
      - '.github/workflows/reversepuck-appimage.yml'
  pull_request:
    paths:
      - 'ReversePuck/**'
      - '.github/workflows/reversepuck-appimage.yml'
  workflow_dispatch:

concurrency:
  group: reversepuck-appimage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # git describe needs the tags for the version
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        # pip download fetches the bundled wheels for the AppImage's own Python (3.12, manylinux2014)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install squashfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        id: build
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            export VERSION="${GITHUB_REF_NAME}"
          fi
          ReversePuck/packaging/build-appimage.sh
          OUT="$(ls build/reversepuck-appimage/ReversePuck-*-x86_64.AppImage)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          echo "Built \`$(basename "$OUT")\` ($(du -h "$OUT" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.build.outputs.path }}

  release:
    # On a release tag, attach the AppImage to that release. release.yml creates the release from the
    # same tag in a separate run, so wait for it rather than racing it.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          for _ in $(seq 1 60); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.AppImage -R "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "Release $TAG did not appear within 30 minutes" >&2
          exit 1
