# OpenPuck DualSense mode: start the haptic channels of the controller's audio output at full volume.
#
# Optional. DualSense audio haptics work without this; it works around WirePlumber starting every new output
# at 40% on the slider (~6% signal), which makes the haptics feel weak until the output is raised. See
# openpuck-dualsense-haptics.lua for what it changes: only the haptic channels (3-4) of the DualSense "Direct"
# output, only for routes WirePlumber has not saved a volume for. The mic and the speaker/headphone channels
# keep WirePlumber's defaults.
#
# Install both files with `make install-wireplumber`: this one in ~/.config/wireplumber/wireplumber.conf.d/,
# the script in ~/.local/share/wireplumber/scripts/.

wireplumber.components = [
  {
    name = openpuck-dualsense-haptics.lua, type = script/lua
    provides = custom.openpuck-dualsense-haptics
  }
]

wireplumber.profiles = {
  main = {
    custom.openpuck-dualsense-haptics = required
  }
}
